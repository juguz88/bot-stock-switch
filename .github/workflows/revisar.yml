name: Monitor de Stock Switch 2

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      probar_telegram:
        description: 'Enviar mensaje de prueba a Telegram para verificar conexión'
        required: false
        default: false
        type: boolean

concurrency:
  group: monitor-stock-switch2
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías necesarias
        run: pip install -q --no-cache-dir beautifulsoup4 curl_cffi

      - name: Ejecutar comprobador
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MODO_PRUEBA: ${{ inputs.probar_telegram }}
        run: python comprobador.py
