name: Monitor de Stock Switch 2

on:
  schedule:
    # Se ejecuta cada 5 minutos de forma automática
    - cron: '*/5 * * * *'
  workflow_dispatch: # Botón para probarlo a mano cuando quieras

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install requests beautifulsoup4

      - name: Ejecutar comprobador
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python comprobador.py
